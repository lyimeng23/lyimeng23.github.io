<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<style>
  @font-face { font-family:"Instrument Serif"; src:url("/assets/fonts/InstrumentSerif-Regular.woff2") format("woff2"); font-weight:400; }
  @font-face { font-family:"Newsreader"; src:url("/assets/fonts/Newsreader-Variable.woff2") format("woff2"); font-weight:300 700; }
  @font-face { font-family:"IBM Plex Mono"; src:url("/assets/fonts/IBMPlexMono-400.woff2") format("woff2"); font-weight:400; }
  @font-face { font-family:"IBM Plex Mono"; src:url("/assets/fonts/IBMPlexMono-500.woff2") format("woff2"); font-weight:500; }
  @font-face { font-family:"IBM Plex Mono"; src:url("/assets/fonts/IBMPlexMono-600.woff2") format("woff2"); font-weight:600; }
  * { box-sizing: border-box; margin: 0; }
  body { width:1200px; height:630px; background:#faf9f5; font-family:"Newsreader",Georgia,serif; color:#16150f; }
  .card { position:relative; height:630px; padding:74px 76px; display:flex; flex-direction:column; }
  .eyebrow { font-family:"IBM Plex Mono",monospace; font-size:15px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:#837d70; display:flex; align-items:center; gap:14px; }
  .eyebrow i { width:5px; height:5px; border-radius:50%; background:#837d70; display:block; }
  .eyebrow { color:#17503f; }
  .who { display:flex; align-items:flex-end; gap:30px; margin-top:30px; }
  .face { width:128px; height:171px; object-fit:cover; border-radius:2px; flex:none; }
  .title { font-family:"Instrument Serif",Georgia,serif; font-size:104px; line-height:.9; letter-spacing:-.035em; }
  .role { margin-top:16px; max-width:790px; white-space:nowrap; font-family:"IBM Plex Mono",monospace; font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:#6b6659; }
  .sub { margin-top:24px; font-size:30px; line-height:1.36; color:#55514a; max-width:31ch; font-weight:380; }
  .foot { margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; gap:40px; padding-top:28px; border-top:1px solid #e2ded1; }
  .chain { display:flex; align-items:center; gap:14px; font-family:"IBM Plex Mono",monospace; font-size:16px; letter-spacing:.06em; color:#55514a; }
  .chain span + span { padding-left:14px; border-left:1px solid #e2ded1; }
  .sig { display:flex; gap:7px; }
  .sig rect { fill:none; stroke:#16150f; stroke-width:1.5; }
  .sig rect.on { fill:#17503f; stroke:#17503f; }
  .field { position:absolute; right:76px; top:262px; width:262px; height:262px; overflow:hidden; }
  .field .ln { position:absolute; inset:0; }
</style>
</head>
<body>
  <div class="card">
    <div class="field">
      <svg class="ln" viewBox="0 0 300 300" fill="none" stroke="#cfc9ba" stroke-width="1.4">
        <path d="M0 50H300M0 100H300M0 150H300M0 200H300M0 250H300M50 0V300M100 0V300M150 0V300M200 0V300M250 0V300"/>
      </svg>
      <svg class="ln" viewBox="0 0 300 300" fill="none" stroke-width="2.4">
        <path d="M28 262 C90 236 150 258 214 232 C252 218 282 226 300 216" stroke="#16150f" stroke-width="2.6" opacity=".45"/>
        <path d="M44 34 L96 46 L148 40" stroke="#d8a24a" stroke-width="2.4" stroke-dasharray="7 7"/>
        <circle cx="96" cy="46" r="7" stroke="#2f8a6c" stroke-width="2.6" fill="#2f8a6c" fill-opacity=".16"/>
        <rect x="176" y="112" width="52" height="26" rx="6" stroke="#2f8a6c" stroke-width="2.6" fill="#2f8a6c" fill-opacity=".14"/>
        <path d="M176 125 L120 125" stroke="#2f8a6c" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M120 125 L134 119 M120 125 L134 131" stroke="#2f8a6c" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M96 46 L136 96 A74 74 0 0 1 62 116 Z" fill="#d8a24a" fill-opacity=".12" stroke="#d8a24a" stroke-width="2" stroke-dasharray="6 6"/>
        <path d="M96 46 L136 96" stroke="#d8a24a" stroke-width="1.6" stroke-dasharray="3 4"/>
        <circle cx="136" cy="96" r="8" stroke="#d8a24a" stroke-width="2"/>
      </svg>
    </div>

    <p class="eyebrow">Spatial Intelligence</p>
    <div class="who">
      <img class="face" src="../assets/img/avatar3_lyimeng.webp" alt="">
      <h1 class="title">Yimeng Liu</h1>
    </div>
    <p class="role">Ph.D. candidate, Computer Science &amp; Engineering &middot; Michigan State University</p>
    <p class="sub">I work on AI that has to know where it is — and keep that understanding current enough to act on.</p>

    <div class="foot">
      <p class="chain"><span>Sense</span><span>Represent</span><span>Model</span><span>Reason</span><span>Act</span></p>
      <div class="sig">
        <svg width="52" height="52" viewBox="0 0 24 24">
          <g fill="none" stroke="#16150f" stroke-width="1.6">
            <rect x="2.2" y="2.2" width="5.6" height="5.6"/><rect x="9.2" y="2.2" width="5.6" height="5.6"/><rect x="16.2" y="2.2" width="5.6" height="5.6"/>
            <rect x="2.2" y="9.2" width="5.6" height="5.6"/><rect x="2.2" y="16.2" width="5.6" height="5.6"/><rect x="16.2" y="9.2" width="5.6" height="5.6"/>
            <rect x="9.2" y="16.2" width="5.6" height="5.6"/><rect x="16.2" y="16.2" width="5.6" height="5.6"/>
          </g>
          <rect class="on" x="9.2" y="9.2" width="5.6" height="5.6"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
