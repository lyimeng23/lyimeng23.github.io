<header class="nav" id="site-nav">
  <div class="container nav__inner">
    <a class="nav__brand" href="{{ '/' | relative_url }}">
      <span class="nav__mark" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="18" height="18" focusable="false">
          <rect x="1" y="1" width="5" height="5" /><rect x="8" y="1" width="5" height="5" opacity=".45" />
          <rect x="15" y="1" width="4" height="5" opacity=".45" />
          <rect x="1" y="8" width="5" height="5" opacity=".45" />
          <rect x="8" y="8" width="5" height="5" /><rect x="15" y="8" width="4" height="5" opacity=".45" />
          <rect x="1" y="15" width="5" height="4" opacity=".45" />
          <rect x="8" y="15" width="5" height="4" opacity=".45" />
          <rect x="15" y="15" width="4" height="4" opacity=".45" />
        </svg>
      </span>
      <span class="nav__name">Yimeng Liu</span>
    </a>

    <button
      type="button"
      id="nav-toggle"
      class="nav__toggle"
      aria-expanded="false"
      aria-controls="nav-menu"
    >
      <span class="nav__toggle-bar" aria-hidden="true"></span>
      <span class="nav__toggle-bar" aria-hidden="true"></span>
      <span class="visually-hidden">Menu</span>
    </button>

    <nav class="nav__menu" id="nav-menu" aria-label="Primary">
      <ul class="nav__list">
        {% for item in site.data.nav.main %}
        <li><a class="nav__link" href="{{ item.url | relative_url }}" data-nav-link="{{ item.id }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
      <div class="nav__aside">
        {% if site.cv_link %}<a class="nav__cv" href="{{ site.cv_link }}" target="_blank" rel="noopener">CV</a>{% endif %}
        <a class="nav__icon" href="{{ site.google_scholar }}" target="_blank" rel="noopener" aria-label="Google Scholar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 24a7 7 0 1 1 7-7 7 7 0 0 1-7 7zm0-12V8.5L6.5 12h5.5zm7.14-4.04L16.56 6.9A5 5 0 0 0 6.5 6.9l5.5 3.5 7.14-4.44v4.44z"/></svg>
        </a>
        <a class="nav__icon" href="{{ site.github }}" target="_blank" rel="noopener" aria-label="GitHub">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3-1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6a11.2 11.2 0 0 0 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
        </a>
      </div>
    </nav>
  </div>
</header>
