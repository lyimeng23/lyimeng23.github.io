<header class="nav" id="site-nav">
  <div class="container nav__inner">
    <a class="nav__brand" href="{{ home | relative_url }}">{{ copy.name }}</a>
    <nav class="nav__menu" id="nav-menu" aria-label="{{ ui.primary }}">
      <a href="{{ home }}#about">{{ ui.about }}</a>
      <a href="{{ home }}publications/">{{ ui.record }}</a>
      <a href="{{ home }}#why">{{ ui.research }}</a>
      <a href="{{ home }}#community">{{ ui.service }}</a>
    </nav>
    <div class="nav__tools">
      <a class="language" href="{{ page.translation | default: '/zh/' }}" lang="{% if lang == 'zh' %}en{% else %}zh-CN{% endif %}" hreflang="{% if lang == 'zh' %}en{% else %}zh-CN{% endif %}" aria-label="{% if lang == 'zh' %}Read in English{% else %}阅读中文版{% endif %}">{% if lang == 'zh' %}EN{% else %}中文{% endif %}</a>
      <label class="theme-control"><span class="visually-hidden">{{ ui.theme }}</span><select id="theme" aria-label="{{ ui.theme }}"><option value="system">{{ ui.system }}</option><option value="light">{{ ui.light }}</option><option value="dark">{{ ui.dark }}</option></select></label>
      <button id="nav-toggle" class="nav__toggle" type="button" aria-controls="nav-menu" aria-expanded="false" hidden>{{ ui.menu }}</button>
    </div>
  </div>
</header>
