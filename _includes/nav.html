<header class="site-nav" id="site-nav">
  <div class="container site-nav__inner">
    <a class="site-nav__brand" href="{{ '/' | relative_url }}">
      <span class="site-nav__name">{{ site.title }}</span>
    </a>

    <button
      id="nav-toggle"
      class="site-nav__toggle"
      aria-expanded="false"
      aria-controls="site-nav-menu"
    >
      <span class="site-nav__toggle-bar"></span>
      <span class="site-nav__toggle-bar"></span>
      <span class="site-nav__toggle-bar"></span>
      <span class="visually-hidden">Menu</span>
    </button>

    <nav class="site-nav__menu" id="site-nav-menu" aria-label="Primary">
      {% for item in site.data.nav.main %}
      <a class="site-nav__link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endfor %}
      <span class="site-nav__social">
        {% if site.google_scholar %}
        <a href="{{ site.google_scholar }}" target="_blank" rel="noopener" aria-label="Google Scholar" title="Google Scholar">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M12 24a7 7 0 1 1 7-7 7 7 0 0 1-7 7zm0-12V8.5L6.5 12h5.5zm7.14-4.04L16.56 6.9A5 5 0 0 0 6.5 6.9l5.5 3.5 7.14-4.44v4.44z"/>
          </svg>
        </a>
        {% endif %}
        {% if site.github %}
        <a href="{{ site.github }}" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6a11.2 11.2 0 0 0 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/>
          </svg>
        </a>
        {% endif %}
        {% if site.linkedin %}
        <a href="{{ site.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.55C0 23.22.79 24 1.77 24h20.45c.98 0 1.78-.78 1.78-1.73V1.72C24 .77 23.2 0 22.22 0z"/>
          </svg>
        </a>
        {% endif %}
        {% if site.cv_link %}
        <a href="{{ site.cv_link }}" target="_blank" rel="noopener" aria-label="CV" title="CV">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <path d="M14 2v6h6" />
            <path d="M9 15h6M9 11h6" />
          </svg>
        </a>
        {% endif %}
      </span>
    </nav>
  </div>
</header>
<a class="skip-link" href="#main">Skip to content</a>
