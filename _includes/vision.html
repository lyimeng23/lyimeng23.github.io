<section class="section section--vision" id="vision" tabindex="-1">
  <div class="container">
    <header class="section__head section__head--split">
      <div class="section__head-main">
        <p class="eyebrow"><span class="eyebrow__index">08</span> The ambition</p>
        <h2 class="section__title">What I actually<br>want to build</h2>
      </div>
      <p class="section__note">{{ site.data.vision.intro }}</p>
    </header>

    <figure class="vision__figure">
      <canvas class="vision__canvas"
              data-vision-canvas
              width="1200" height="620"
              role="img"
              aria-label="{{ site.data.vision.canvas_alt }}"></canvas>

      <!-- No-JS and reduced-motion: the argument is carried by the text, not the animation. -->
      <figcaption class="vision__caption">
        <ol class="vision__steps">
          {% for step in site.data.vision.steps %}
          <li class="vision__step">
            <span class="vision__step-key">{{ step.key }}</span>
            <span class="vision__step-text">{{ step.text }}</span>
          </li>
          {% endfor %}
        </ol>
      </figcaption>
    </figure>

    <div class="vision__close">
      <p class="vision__aspiration">{{ site.data.vision.aspiration }}</p>
      <div class="vision__notyet">
        <p class="vision__notyet-label">What does not exist yet</p>
        <p class="vision__notyet-body">{{ site.data.vision.honest }}</p>
      </div>
    </div>
  </div>
</section>
