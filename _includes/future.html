<section class="section agenda" id="future"><div class="container">
  <header class="section__head"><p class="meta">{{ ui.future_label }}</p><h2>{{ copy.future_title }}</h2><p class="lede">{{ copy.future_intro }}</p></header>
  <div class="agenda__space">{% for thrust in copy.future %}<article class="agenda__thrust"><h3>{{ thrust.title }}</h3><p class="agenda__question">{{ thrust.question }}</p><p>{{ thrust.body }}</p><p class="meta">{{ thrust.origin }}</p></article>{% endfor %}</div>
</div></section>
