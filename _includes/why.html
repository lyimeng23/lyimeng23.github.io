<section class="section why" id="why">
  <div class="container">
    <h2 class="statement">{{ copy.why_title }}</h2>
    <div class="why__body"><p class="lede">{{ copy.why_body }}</p>
      <dl class="why__facts">{% for point in copy.why_points %}<div><dt>{{ point.title }}</dt><dd>{{ point.text }}</dd></div>{% endfor %}</dl>
    </div>
  </div>
</section>
