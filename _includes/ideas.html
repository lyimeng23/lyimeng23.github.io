<section class="section thinking" id="ideas"><div class="container">
  <h2>{{ copy.thinking_title }}</h2>
  <dl class="thinking__principles">{% for principle in copy.principles %}<div><dt>{{ principle.title }}</dt><dd>{{ principle.text }}</dd></div>{% endfor %}</dl>
  <p class="thinking__reading"><span class="meta">{% if lang == 'zh' %}延伸阅读{% else %}Further reading{% endif %}</span> <a href="{{ home }}writing/observation-and-understanding/">{{ copy.essay_title }}</a></p>
</div></section>
