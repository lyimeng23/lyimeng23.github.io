<section class="section journey" id="journey">
  <div class="container journey__grid">
    <header class="journey__intro"><h2>{{ copy.journey_title }}</h2><p class="lede">{{ copy.journey_intro }}</p></header>
    <ol class="journey__steps">{% for step in copy.journey %}<li>
      <p class="meta">{{ step.period }}</p><h3>{{ step.title }}</h3><p>{{ step.text }}</p><a class="text-link" href="{% if lang == 'zh' %}/zh{% endif %}{{ step.link }}">{{ step.anchor }}</a>
    </li>{% endfor %}</ol>
  </div>
</section>
