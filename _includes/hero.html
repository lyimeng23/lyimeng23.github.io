<section class="hero" id="top"><div class="container hero__grid" id="about">
  <div class="hero__copy"><h1>{{ copy.name }}</h1>
    <p class="hero__bio">{{ copy.bio }}</p><p class="hero__background">{{ copy.background }}</p>
    <div class="hero__current"><p class="hero__label">{{ copy.current_title }}</p><p>{{ copy.current_body }}</p></div>
    <div class="hero__links"><a href="{{ site.cv_link }}" target="_blank" rel="noopener">{{ ui.cv }}</a><a href="{{ site.google_scholar }}" target="_blank" rel="noopener">{{ ui.scholar }}</a><a href="{{ home }}publications/">{{ ui.record }}</a><a href="{{ site.github }}" target="_blank" rel="noopener">{{ ui.github }}</a><a href="{{ site.email_link }}">{{ ui.email }}</a></div>
  </div>
  <figure class="hero__portrait"><img src="{{ site.avatar }}" width="299" height="400" alt="Yimeng Liu" decoding="async" fetchpriority="high" /><figcaption>{% for item in site.data.record.education %}<p><span>{{ item.period }}</span><strong>{% if lang == 'zh' %}{{ item.degree_zh }}{% else %}{{ item.degree }}{% endif %}</strong><span>{% if lang == 'zh' %}{{ item.place_zh }}{% else %}{{ item.place }}{% endif %}</span></p>{% endfor %}</figcaption></figure>
</div></section>
