    authors: "<strong>Yimeng Liu</strong>, Maolin Gan, Huacheng Zeng, Yidong Ren, Gen Li, Jingkai Lin, Younsuk Dong, Xiaobo Tan, Zhichao Cao"
    venue: "Proceedings of the 23rd ACM Conference on Embedded Networked Sensor Systems"
