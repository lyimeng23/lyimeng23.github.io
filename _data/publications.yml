    bibtex: /assets/files/adonis.bib
    slides: /assets/files/Adonis-INFOCOM25.pptx
    scholar: 2osOgNQ5qMEC
    understanding: >-
      The same physical state, represented compactly enough to be deployable rather than only
      demonstrable — range-Doppler, range-phase and range-azimuth maps with learned features and
      calibration. Proteus asked whether the state could be recovered; Adonis asked whether the
      representation survives contact with a real budget.

  - id: gapfill
    title: "Comparative Analysis of Machine Learning Models to Restore Gaps in Multivariate Time Series Leaf Wetness Sensor Data"
    authors: "Shivani Rana, Nawab Ali, Zhichao Cao, Jill C. Check, Martin I. Chilvers, Jaime Willbur, Benjamin Werling, <strong>Yimeng Liu</strong>, Younsuk Dong"
