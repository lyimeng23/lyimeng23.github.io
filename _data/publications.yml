    track: represent
    cited: 1
    bibtex: /assets/files/gapfill.bib
    scholar: zYLM7Y9cAGgC
    understanding: >-
      The unglamorous half of the thesis. A state you hold across time is only as good as what
      happens when your sensors stop reporting — and this paper is an honest measurement of how
      badly standard imputation fails on exactly the signal I care about.

  # ---------------- Grounded action ----------------
  - id: driving
    title: "AIoT-Based Continuous, Contextualized, and Explainable Driving Assessment for Older Adults"
    authors: "<strong>Yimeng Liu</strong>, Fangwei Zhang, Maolin Gan, Jialuo Du, Jingkai Lin, Yawen Wang, Fei Sun, Honglei Chen, Linda Hill, Ruofeng Liu, Tianxing Li, Zhichao Cao"
    venue: "arXiv preprint arXiv:2603.00691"
    venue_short: "arXiv'26"
    year: 2026
    track: act
    cited: 0
    page: "https://arxiv.org/abs/2603.00691"
    bibtex: /assets/files/driving.bib
    project: /project/senior-driving/
    scholar: Y0pCki6q_DkC
    understanding: >-
      Everyday driving as a continuous functional record instead of an occasional clinic
      snapshot — separating age-related change from situational factors like traffic and weather.
      This one is a design-principles and research-opportunities document: it proposes the
      sensing, modelling and context architecture, and states plainly that a reliable real-world
      monitoring system still has to be built and evaluated. The action stage of my agenda is
      genuinely unfinished, and this paper is an argument for how to finish it, not a result.

