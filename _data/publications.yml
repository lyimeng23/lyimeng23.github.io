main:
  # ---------------- Sense ----------------
  - id: sonar
    title: "Detection of Passageways in Natural Foliage Using Biomimetic Sonar"
    authors: "Rongkun Wang, <strong>Yimeng Liu</strong>, Rolf Müller"
    venue: "Bioinspiration & Biomimetics"
    venue_short: "Bioinspir."
    year: 2022
    track: sense
    cited: 27
    pdf: /assets/files/biodetection.pdf
    bibtex: /assets/files/biodetection.bib
    scholar: u-x6o8ySG0sC
    understanding: >-
      My first attempt at the question I am still working on: can structure in a space be
      recovered from returns that are sparse and indirect? Echolocation through dense foliage,
      where optical sensing simply fails. I would not have called this Spatial Intelligence
      then, but it set the habit of asking what a measurement can and cannot support.

  - id: mmleaf
    title: "mmLeaf: Versatile Leaf Wetness Detection via mmWave Sensing"
    authors: "Maolin Gan, <strong>Yimeng Liu</strong>, Li Liu, Cheng Wu, Younsuk Dong, Huacheng Zeng, Zhichao Cao"
    venue: "Proceedings of the 21st Annual International Conference on Mobile Systems and Applications"
    venue_short: "MobiSys'23"
    year: 2023
    track: sense
    cited: 19
    pdf: /assets/files/mmleaf.pdf
    bibtex: /assets/files/mmleaf.bib
    slides: /assets/files/mmleaf.pdf
    scholar: u5HHmVD_uO8C
    understanding: >-
      MIMO SAR imaging of a leaf at varying working range. This is where the RF modality
      entered the work — and where I first ran into the fact that a camera and a radar do not
      observe the same thing. Everything published after this is a consequence of that.

  - id: hydra
    title: "Hydra: Accurate Multi-Modal Leaf Wetness Sensing with mm-Wave and Camera Fusion"
    authors: "<strong>Yimeng Liu</strong>, Maolin Gan, Huacheng Zeng, Li Liu, Younsuk Dong, Zhichao Cao"
    venue: "Proceedings of the 30th Annual International Conference on Mobile Computing and Networking"
    venue_short: "MobiCom'24"
    year: 2024
    track: sense
    cited: 26
    pdf: /assets/files/hydra.pdf
    page: "https://doi.org/10.1145/3636534.3690662"
    code: "https://github.com/liuyime2/MobiCom24-Hydra"
    bibtex: /assets/files/hydra.bib
    slides: /assets/files/HydraLiu-MobiCom24.pptx
    scholar: 9yKSN-GCB0IC
    understanding: >-
      The paper that made the problem explicit. Two modalities chosen because they fail under
      *different* conditions, fused so that perception survives losing either one. It is also
      where I stopped treating fusion as the interesting part: a fusion model is really a
      representation problem, and the representation is what has to survive modality loss.

  - id: aeroecho
    title: "AeroEcho: Towards Agricultural Low-Power Wide-Area Backscatter with Aerial Excitation Source"
    authors: "Yidong Ren, Gen Li, <strong>Yimeng Liu</strong>, Younsuk Dong, Zhichao Cao"
    venue: "IEEE INFOCOM 2025 — IEEE Conference on Computer Communications"
    venue_short: "INFOCOM'25"
    year: 2025
    track: sense
    cited: 18
    pdf: /assets/files/aeroecho.pdf
    bibtex: /assets/files/aeroecho.bib
    scholar: qjMakFHDy7sC
    understanding: >-
      Passive agricultural sensing over wide areas, excited from the air. This is the piece that
      moved the question from single devices to sensing *infrastructure* — and it is the first
      time my own work depended on observers I do not control, which is a different kind of
      problem from owning a sensor.

  - id: soilnutri
    title: "Soilnutri: A Passive Metasurface-Based, Low-Cost System for Soil Moisture and Nitrogen Monitoring"
    authors: "Juexing Wang, Binbin Xie, <strong>Yimeng Liu</strong>, Minhao Cui, Xiao Zhang, Guangjing Wang, Ke Sun, Zhichao Cao, Huacheng Zeng, Qingxu Jin, Younsuk Dong, Hui Li, Jie Xiong, Tianxing Li"
    venue: "Proceedings of the ACM on Interactive, Mobile, Wearable and Ubiquitous Technologies"
    venue_short: "IMWUT'26"
    year: 2026
    track: sense
    cited: 5
    bibtex: /assets/files/soilnutri.bib
    scholar: W7OEmFMy1HYC
    understanding: >-
      Passive, low-cost, metasurface-based sensing of soil moisture and nitrogen. Environmental
      monitoring at the scale where the sensing substrate itself has to be close to free — the
      regime where "many cheap unreliable observers" stops being a thought experiment and starts
      being the only affordable design.

