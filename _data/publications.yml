    cited: 15
    pdf: /assets/files/proteus.pdf
    page: "https://doi.org/10.1145/3715014.3722052"
    bibtex: /assets/files/proteus.bib
    slides: /assets/files/Proteus-SenSys25.pptx
    scholar: UeHWp8X0CEIC
    understanding: >-
      Cross-modality knowledge transfer: an RGB teacher guiding an mmWave student. The teacher
      was never the point. What mattered was recovering physical structure from sparse
      apertures — and that reframed the task as an inverse problem rather than an image
      enhancement problem, which is a claim about evidence, not about pixels.

  - id: adonis
    title: "Adonis: Neural-Enhanced Fine-Grained Leaf Wetness Sensing with Efficient mmWave Imaging"
    authors: "<strong>Yimeng Liu</strong>*, Maolin Gan*, Gen Li, Younsuk Dong, Zhichao Cao"
    venue: "IEEE INFOCOM 2025 — IEEE Conference on Computer Communications"
    venue_short: "INFOCOM'25"
