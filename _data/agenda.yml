# Spatial Intelligence — the single source of truth for the research chain.
# Used by the instrument (signature interaction) and by the Research System section.
# `key`    : two-digit stage index
# `label`  : short stage name (also the nav/legend key)
# `question`: the question that capability answers
# `summary`: one sentence shown beside the instrument while scrolling
# `layer`  : SVG group suffix in _includes/instrument.html
# `maturity`: proven | building | open  — honesty about what has evidence
# `evidence`: published / ongoing work that backs this stage (empty if none)

main:
  - key: "01"
    layer: world
    read: "a place exists — nothing is known about it yet"
    label: Physical World
    capability: The problem
    question: What exists before any model interprets it?
    summary: A street is not a dataset. It is populated, occluded, and changing while you look at it.
    maturity: proven
    evidence: ""

  - key: "02"
    layer: sense
    read: "partial, differently-biased returns"
    label: Sense
    capability: Multimodal perception
    question: What is actually there?
    summary: Camera, mmWave/RF, and vehicle sensing each return a partial, differently-biased view. None of them is the world.
    maturity: proven
    evidence: "Hydra (MobiCom '24) · mmLeaf (MobiSys '23) · AeroEcho (INFOCOM '25) · Biomimetic sonar (2022)"

  - key: "03"
    layer: represent
    read: "position · extent · identity · motion"
    label: Represent
    capability: Spatial representation
    question: Where is it, and what is it?
    summary: Raw returns become persistent entities — position, extent, identity, motion — so a second look recognises the same thing.
    maturity: proven
    evidence: "Proteus (SenSys '25) · Adonis (INFOCOM '25) · Hydra-Bench (arXiv '25)"

  - key: "04"
    layer: model
    read: "the same entities, held across time"
    label: Model
    capability: Persistent world state
    question: How is it changing?
    summary: The same entities are held across time, so the system knows what moved, what was occluded, and what is still missing.
    maturity: building
    evidence: ""

  - key: "05"
    layer: reason
    read: "relations · uncertainty · candidate futures"
    label: Reason
    capability: Spatial reasoning
    question: Why, and what happens next?
    summary: Relations and uncertainty become explicit — who yields to whom, how certain the crossing is, where the likely futures lead.
    maturity: open
    evidence: ""

  - key: "06"
    layer: act
    read: "one committed response"
    label: Act
    capability: Grounded action
    question: What should be done?
    summary: One committed response — slow, yield, alert, re-plan — taken from the spatial state rather than from a frame of pixels.
    maturity: building
    evidence: "Cognitive Driving (ongoing, human-centred)"