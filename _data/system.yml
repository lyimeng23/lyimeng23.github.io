# The Research System — my work organised by capability layer, not by year.
# Maturity is stated honestly: what has published evidence, what is in progress, what is open.

main:
  - key: "01"
    layer: sense
    capability: "Sense"
    title: "Read physical state through partial views"
    body: >-
      Different sensors fail in different ways. The capability I have built and published is to make
      perception survive that fact: two modalities that cover each other's blind spots, and RF that
      recovers physical detail when light does not.
    maturity: proven
    maturity_label: "Published"
    what:
      - "Modality redundancy — perception that holds when one channel degrades"
      - "RF imaging that resolves state optics cannot, at longer working ranges"
      - "Sensing infrastructure for environments where cameras, power, or coverage fail"
    evidence:
      - title: "Hydra"
        meta: "ACM MobiCom '24"
        note: "mmWave depth + RGB fusion, transformer encoder over fused feature maps"
      - title: "mmLeaf"
        meta: "ACM MobiSys '23"
        note: "FMCW radar with MIMO SAR imaging of leaves at varying distance"
      - title: "AeroEcho"
        meta: "IEEE INFOCOM '25"
        note: "Aerial excitation and backscatter tags for wide-area agricultural sensing"
      - title: "Biomimetic sonar"
        meta: "Bioinspir. Biomim. '22"
        note: "Passive echo sensing for passageways in dense foliage"

  - key: "02"
    layer: represent
    capability: "Represent"
    title: "Turn returns into stable spatial structure"
    body: >-
      Raw signal is not a representation. This layer is about turning partial, noisy, modality-specific
      returns into structure that can be reasoned over: cross-modal transfer when a modality is missing,
      and calibrated imaging that stays precise across distances and conditions.
    maturity: proven
    maturity_label: "Published"
    what:
      - "Cross-modality transfer — keep sensing when the second modality is unavailable"
      - "Multi-view signal processing — separate measurements that carry complementary detail"
      - "Calibration that holds accuracy across environments instead of one lab setting"
    evidence:
      - title: "Proteus"
        meta: "ACM SenSys '25"
        note: "RGB teacher guides an mmWave SAR student; speckle reduction and phase-angle features"
      - title: "Adonis"
        meta: "IEEE INFOCOM '25"
        note: "Range-Doppler, range-phase and range-azimuth maps with learned features and calibration"
      - title: "Hydra-Bench"
        meta: "arXiv '25"
        note: "Six months of synchronised mmWave raw, SAR and RGB data as a public benchmark"

  - key: "03"
    layer: model
    capability: "Maintain"
    title: "Hold the same entities across time"
    body: >-
      The layer I am working towards. Representation becomes understanding only when identity, position
      and state persist across frames and across occlusions, with explicit record of what is still missing.
      I have no published result here yet; it is the next thing to build.
    maturity: building
    maturity_label: "In progress"
    what:
      - "Entity persistence — the same object recognised across time and modality"
      - "Occlusion and missingness as first-class state, not as gaps to be smoothed away"
      - "State that a downstream reasoner can query, not just a feature vector"
    evidence: []

  - key: "04"
    layer: reason
    capability: "Reason"
    title: "Make relations, uncertainty and futures explicit"
    body: >-
      Also open. The question is not whether a network can regress a trajectory, but whether the system
      can state who is interacting with whom, how confident it is, and which futures it is choosing between.
    maturity: open
    maturity_label: "Open question"
    what:
      - "Entity relations — crossing, following, occluding — as objects, not as features"
      - "Calibrated uncertainty attached to each claim, so risk can be priced"
      - "Prediction evaluated as decision quality, not only as trajectory error"
    evidence: []

  - key: "05"
    layer: act
    capability: "Act"
    title: "Let spatial understanding change what a system does"
    body: >-
      My current, human-centred direction: continuous in-car sensing and simulator assessment for older
      drivers, where an early, gentle intervention matters more than a late certain one. It is ongoing
      research, and it is where I intend to close the loop from understanding to action.
    maturity: building
    maturity_label: "Ongoing"
    what:
      - "Continuous monitoring that flags risk earlier than a clinical threshold would"
      - "Simulator protocols that isolate the cognitive demands real roads impose"
      - "Community education, so insight actually reaches the people it is about"
    evidence:
      - title: "Cognitive Driving"
        meta: "Ongoing project"
        note: "Senior driving safety and cognitive health — MSU, with Social Work and Epidemiology"