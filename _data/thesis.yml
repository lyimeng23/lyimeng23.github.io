# The person, first. Everything on the site is in service of one of five threads:
#   我是谁   who I am
#   我在做什么 what I work on
#   我有什么工作 what I have built
#   我有什么想法 / 思想 what I believe and am still arguing about
#   路线     where this goes
# Nothing here is a claim of result. It is the position the evidence supports.

hero:
  # First person, and about me rather than about "AI". The research question is still
  # the whole agenda, but it is stated as what I do, not as a subject waiting for a subject.
  standfirst: >-
    I work on AI that has to know where it is — building a working understanding of a physical
    space out of incomplete sensors, and keeping that understanding current enough to act on.

# The label for the field, kept because it is memorable and because it is what the work adds up to.
# It sits with the person in the hero; it does not replace the person.
field: "Spatial Intelligence"

# Used once, in the footer — a signature, not a restatement of the hero.
signature: "Spatial Intelligence — from incomplete observation to grounded action."

# Frames the three convictions. Deliberately not "what I believe": these are conclusions the
# work forced, and saying so is the difference between a position and a slogan.
thesis_note: >-
  These are the three conclusions my own systems kept forcing on me — not a manifesto, and not
  three things I decided in advance.

beliefs:
  - key: "I"
    title: "A sensor never returns the world."
    body: >-
      Every return is a partial, biased slice. A camera fails in the dark and in rain; a radio
      echo knows distance but not colour. Hydra only worked once I stopped treating mmWave and
      camera as two views of one truth and started treating them as two questions that fail
      differently — which is why this is a representation problem, not a fusion problem.
  - key: "II"
    title: "Understanding has to persist."
    body: >-
      A snapshot is not understanding. Proteus and Adonis could both read a leaf well at a given
      moment; what neither could do is hold the same entity across time, notice what moved, what
      was occluded, and what is still unknown. Holding state long enough to reason over it turned
      out to be the harder half of the problem.
  - key: "III"
    title: "The test is a decision."
    body: >-
      A representation earns its keep only when it changes what a system does. I care about models
      whose output is a grounded action — yield, slow down, alert, hand control back. Prediction
      that leaves the decision unchanged is a demo, and I would rather ship the slower version
      that actually moves something.