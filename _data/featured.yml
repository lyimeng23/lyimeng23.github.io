# Featured research shown on the homepage (most representative of trajectory
# and future direction). "problem" and "contribution" are one-line each.
main:
  - id: hydra
    title: "Hydra"
    tagline: "Multi-modal leaf wetness sensing with mm-Wave and camera fusion"
    problem: "Outdoor leaf-wetness sensing is fragile under changing light and weather."
    contribution: "First contactless mmWave + RGB fusion system — 96% accuracy indoors, ~90% in real farms."
    venue: "ACM MobiCom 2024"
    image: /assets/files/hydra.webp
    pdf: /assets/files/hydra.pdf
    code: https://github.com/liuyime2/MobiCom24-Hydra
    slides: /assets/files/HydraLiu-MobiCom24.pptx

  - id: proteus
    title: "Proteus"
    tagline: "Cross-modality knowledge transfer for mmWave leaf wetness detection"
    problem: "High-accuracy fine-grained sensing depends on slow, costly scanning."
    contribution: "Transfers mmWave sensing knowledge across modalities so lightweight systems reach scanner-grade accuracy."
    venue: "ACM SenSys 2025"
    image: /assets/files/proteus.webp
    pdf: /assets/files/proteus.pdf
    page: https://dl.acm.org/doi/10.1145/3715014.3722052
    slides: /assets/files/Proteus-SenSys25.pptx

  - id: adonis
    title: "Adonis"
    tagline: "Neural-enhanced fine-grained leaf wetness sensing with efficient mmWave imaging"
    problem: "mmWave imaging trades scan speed against fine spatial detail."
    contribution: "Neural imaging keeps accuracy at wider scan distances — faster, finer, and more robust sensing."
    venue: "IEEE INFOCOM 2025"
    image: /assets/files/Adonis.webp
    pdf: /assets/files/adonis.pdf
    slides: /assets/files/Adonis-INFOCOM25.pptx

  - id: driving
    title: "Cognitive Driving"
    tagline: "LLM-driven perception and decision-making for human-centered driving"
    problem: "Driving assistants need semantic risk awareness, not just object lists."
    contribution: "Grounding LLM reasoning in multi-modal perception for risk-aware decisions, evaluated in CARLA."
    venue: "Research direction"
    status: "Ongoing"
    image: /project/senior-driving/images/driving_bg.webp
    more: /project/senior-driving/