# Featured research shown on the homepage (most representative of trajectory
# and future direction). Each entry follows question -> idea -> evidence -> result.
# "capability" labels which generalizable stage of the Spatial Intelligence
# agenda a project demonstrates (not a stage number of a designed pipeline).
main:
  - id: hydra
    title: "Hydra"
    capability: "Multimodal Perception"
    tagline: "Complementary mmWave–vision fusion for sensing under adverse conditions"
    question: "Can complementary sensing modalities preserve physical perception when one channel degrades?"
    idea: "Fuse mmWave depth images and RGB features with a learned multimodal encoder."
    result: "Up to 96% accuracy across evaluated scenarios, with around 90% accuracy in rainy, dawn, or poorly lit farm conditions."
    venue: "ACM MobiCom 2024"
    tier: "Published foundation"
    image: /assets/files/hydra.webp
    pdf: /assets/files/hydra.pdf
    code: https://github.com/liuyime2/MobiCom24-Hydra
    slides: /assets/files/HydraLiu-MobiCom24.pptx

  - id: proteus
    title: "Proteus"
    capability: "Cross-modal Learning"
    tagline: "Knowledge transfer across sensing modalities when one is unavailable"
    question: "Can knowledge transfer preserve mmWave sensing when RGB is unavailable or unreliable?"
    idea: "Use an RGB teacher to guide a mmWave SAR student through cross-modality knowledge transfer."
    result: "Up to 96.3% accuracy across varied environmental scenarios."
    venue: "ACM SenSys 2025"
    tier: "Published foundation"
    image: /assets/files/proteus.webp
    pdf: /assets/files/proteus.pdf
    page: https://dl.acm.org/doi/10.1145/3715014.3722052
    slides: /assets/files/Proteus-SenSys25.pptx

  - id: adonis
    title: "Adonis"
    capability: "Physical Representation"
    tagline: "Recovering fine-grained physical state from sparse RF observations"
    question: "Can sparse mmWave observations recover fine-grained physical state?"
    idea: "Combine signal processing, contrastive feature learning, and calibration for efficient mmWave imaging."
    result: "Leaf-wetness MAE of 4.43 in controlled settings and 6.49 in farm settings, versus 11.84 and 14.32 for traditional sensors."
    venue: "IEEE INFOCOM 2025"
    tier: "Published foundation"
    image: /assets/files/Adonis.webp
    pdf: /assets/files/adonis.pdf
    slides: /assets/files/Adonis-INFOCOM25.pptx

  - id: driving
    title: "Cognitive Driving"
    capability: "Dynamic Spatial Understanding · Ongoing"
    tagline: "Human-centered sensing and safety-aware support for older drivers"
    question: "Can in-car observations support safer, earlier intervention in a dynamic driving space?"
    idea: "Combine simulator assessment, continuous in-car monitoring, realistic testing, and community education."
    result: "Ongoing research; this page does not claim a published spatial-reasoning model or closed-loop action policy."
    venue: "Research direction"
    tier: "Current research"
    status: "Ongoing"
    image: /project/senior-driving/images/driving_bg.webp
    more: /project/senior-driving/
