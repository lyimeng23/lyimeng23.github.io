# Ideas / Working Notes — long-term questions, not results.
# This is the layer that answers "what am I thinking about", which papers cannot.
# Nothing here is claimed as a finding.

intro: >-
  These are questions, not conclusions. They are the part of my work that has no paper attached yet,
  and the part I expect to still be arguing about in five years.

main:
  - key: "Q1"
    title: "What does a model owe the space it models?"
    status: "Open question"
    question: >-
      If understanding a space means maintaining a belief about it, then it also means representing what
      the belief is missing. How should a learned world state carry its own ignorance — and how would we
      ever measure it?
    threads:
      - "Occlusion as first-class state"
      - "Calibrated uncertainty over claims, not over pixels"
      - "Evaluation where the ground truth is, by construction, unobservable"

  - key: "Q2"
    title: "Sensor networks as the nervous system of built space"
    status: "Early work"
    question: >-
      One good camera is a single point of failure and a privacy problem. Many cheap, unreliable,
      intermittent observers might be better. What does an architecture look like when perception is
      distributed, asynchronous, and mostly missing?
    threads:
      - "Redundancy across modalities, locations and time"
      - "Identity when the same thing is seen by sensors that never agree"
      - "Energy, maintenance and the real cost of watching a place"

  - key: "Q3"
    title: "Physical intelligence without a body"
    status: "Speculative"
    question: >-
      A car, a wheeled robot and a radar bolted to a wall all have to understand space. Is there an
      abstraction above embodiment that is not merely a policy, and what would separate a model of a
      place from a habit of moving through it?
    threads:
      - "What actually transfers between embodiments"
      - "State that is useful without being actionable"
      - "Grounding as a design constraint rather than a feature"

  - key: "Q4"
    title: "When should a system ask instead of act?"
    status: "Open question"
    question: >-
      In safety-critical space a false alarm has a social cost and a missed one has a physical one.
      How should an agent price that asymmetry, and what does principled abstention look like when the
      correct behaviour is to hand control back to a human?
    threads:
      - "Abstention and deferral in driving and care"
      - "Risk that is legible to the person being put at risk"
      - "Evaluation that rewards early gentle intervention"

notes:
  - "Sensor fusion is usually framed as improving accuracy. I am more interested in the opposite: what a system has to give up in order to stay alive when half of its inputs are gone."
  - "The hard part of a world model is not the future. It is remembering what it could not see."
  - "A benchmark reporting average accuracy says nothing about the moment a pedestrian steps out of occlusion."