# The research journey — a natural evolution, NOT a taxonomy.
#
# Explicitly replacing the previous six-stage pipeline (Physical World → Sense → Represent →
# Model → Reason → Act). That pipeline retro-fitted published papers onto a stage list, which
# is the retroactive-branding failure mode the job-talk notes warned about.
#
# What is different here:
#   - each step is named after the SCIENTIFIC PROBLEM, not after a system function
#   - each step states what was actually established, and in which venue
#   - the last two steps are labelled current and future, and carry no published evidence
#
# The reading order is the argument: sensing made the failure visible, cross-modal inference
# made partial recovery possible, physical-state estimation made it measurable, and what
# remains unsolved is time and consequence.

# Where the work stands, stated once, in the order a reviewer needs it.
arc:
  - key: "01"
    label: "Multimodal sensing"
    status: "established"
    status_label: "Published"
    standing_label: "Published result"
    period: "2022 – 2025"
    problem: "Physical properties that optics cannot see, in environments where a camera fails or cannot be deployed."
    core_idea: >-
      Choose modalities that fail under different conditions, so that the pair covers what
      neither can alone. Fusion is the mechanism; the redundancy is the contribution.
    established: >-
      Perception that continues to work when one channel degrades — verified on a farm across
      daylight, rain, dawn and poorly lit nights (Hydra, MobiCom '24), and extended to foliage,
      soil and wide-area agricultural sensing (mmLeaf MobiSys '23, AeroEcho INFOCOM '25,
      biomimetic sonar 2022, Soilnutri IMWUT '26).
    figure:
      src: /assets/files/mmleaf.webp
      width: 1140
      height: 564
      alt: "mmLeaf system diagram: a SAR scanning prototype with radar illuminating a potted plant, with the sensing beam marked and leaf wetness annotated"
      caption: "mmLeaf (MobiSys '23) — the SAR scanning prototype and the beam it uses to read a leaf."
    evidence:
      - "Hydra — ACM MobiCom '24"
      - "mmLeaf — ACM MobiSys '23"
      - "AeroEcho — IEEE INFOCOM '25"
      - "Biomimetic sonar — 2022"
      - "Soilnutri — ACM IMWUT '26"

  - key: "02"
    label: "Cross-modal inference"
    status: "established"
    status_label: "Published"
    standing_label: "Published result"
    period: "2025"
    problem: "Sparse RF and mmWave returns carry far less information than an image of the same object."
    core_idea: >-
      Use the modality with rich but shallow information as a teacher for the one with poor but
      deep returns, so structure transfers without pretending the two measure the same thing.
    established: >-
      Cross-modality knowledge transfer recovers physical state from sparse apertures, and
      compact learned representations hold it at deployable cost (Proteus, SenSys '25;
      Adonis, INFOCOM '25).
    evidence:
      - "Proteus — ACM SenSys '25"
      - "Adonis — IEEE INFOCOM '25"

  - key: "03"
    label: "Physical-state estimation"
    status: "established"
    status_label: "Published"
    standing_label: "Published result"
    period: "2025 – 2026"
    problem: "An estimate is only useful if it is correct in the units the decision needs, and if it can be checked."
    core_idea: >-
      Reframe enhancement as an inverse problem with an explicit physical hypothesis, and publish
      the data so the claim is testable by someone who was not in the room.
    established: >-
      mmWave imaging that resolves the physical quantity rather than an image of it; a
      systematic measurement of how badly standard imputation fails on exactly the
      multivariate sensor gaps that matter; and six months of synchronised raw, SAR and RGB
      data released publicly.
    figure:
      src: /assets/files/hydrabench.webp
      width: 758
      height: 639
      alt: "Hydra-Bench system rendering: a robotic arm and camera facing a millimetre-wave panel, with the reconstructed scan volume and a plant carrying water droplets"
      caption: "Hydra-Bench (arXiv '25) — the synchronised sensing volume the benchmark releases."
    evidence:
      - "Proteus — ACM SenSys '25"
      - "Adonis — IEEE INFOCOM '25"
      - "Gap restoration — Computers and Electronics in Agriculture '26"
      - "Hydra-Bench — arXiv '25"

  - key: "04"
    label: "Persistent understanding"
    status: "current"
    status_label: "In progress"
    standing_label: "Where it stands"
    period: "now"
    problem: "A state estimated correctly at one instant is still not an understanding of a place."
    core_idea: >-
      Treat persistence as a first-class property: the belief has to survive a sensor going
      quiet, and it has to be explicit about what it currently does not know.
    established: >-
      Partial. The gap-restoration work measures how little standard methods recover when
      inputs disappear, which is the negative result this direction needs. A representation
      that carries its own uncertainty across time is not yet built or evaluated.
    evidence:
      - "Gap restoration — Computers and Electronics in Agriculture '26 (partial)"

  - key: "05"
    label: "Grounded decision making"
    status: "future"
    status_label: "Future agenda"
    standing_label: "Where it stands"
    period: "next"
    problem: "Better prediction does not by itself change what anyone should do."
    core_idea: >-
      Separate the authority to propose an action from the authority to take it, and make
      declining to act a first-class outcome rather than a failure mode.
    established: >-
      Nothing published. The driving work below is a design-principles and research-opportunities
      paper: it proposes the sensing, modelling and context architecture for longitudinal
      assessment and states that a reliable real-world system still has to be built. No
      spatial-reasoning model and no closed-loop policy is claimed.
    evidence: []

closing:
  title: "Why the sequence matters more than the list"
  body: >-
    Steps 01 to 03 are published and cited, and they are all variations on one idea: recover a
    physical quantity from returns that are each partial and differently biased. Step 04 is
    where that idea runs out — persistence is a different problem from estimation, and it is the
    part I am working on now. Step 05 is the part I am asking a lab for. The trajectory is a
    record of what forced what, not a taxonomy applied afterwards.