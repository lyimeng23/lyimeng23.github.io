    "home_vision_title": "My research vision",
    "home_vision": "I aim to build intelligent systems that turn partial physical observations into persistent, reliable understanding—and use it to reason and act under uncertainty. I see spatial intelligence as this full loop: observing the world, forming and updating representations of it, and knowing when those representations can support action.",
