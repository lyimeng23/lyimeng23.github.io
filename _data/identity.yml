      {
        "question": "What can we know from incomplete evidence?",
        "body": "How can heterogeneous observations be connected to physical state while keeping uncertainty explicit?"
      },
      {
        "question": "How should understanding change over time?",
        "body": "How can a system preserve, revise or discard what it believes as observations and conditions change?"
      },
      {
        "question": "When is understanding reliable enough to act?",
        "body": "How should uncertainty, consequences and missing evidence determine whether a system acts, gathers more information or defers?"
      }
