# Where this goes — the forward-looking layer.
#
# These are QUESTIONS, not results. The work answering them is partly unpublished
# (see docs/DISCLOSURE.md): SPIRIT, Mímir and Snotra are ICLR '27 submissions under
# double-blind review and must never be named, described or quantified here.
#
# Stating the question is legitimate and is in fact the point — a research agenda is
# a set of problems, not a set of answers. What is withheld is the method and the
# result behind each one.

intro: >-
  The published work above answers parts of two of these. The third is the one I am
  spending the most time on, and none of it is finished.

questions:
  - key: "I"
    title: "What can be known from physical evidence?"
    capability: "Observability, not just accuracy"
    body: >-
      Sparse measurements rarely admit a single explanation. A handful of radio returns can be
      produced by many different geometries, and an image that looks right is not the same as a
      surface that would actually scatter that signal. I want inference that commits to an
      explicit physical hypothesis and then tests whether the hypothesis explains the
      measurement — instead of a model that produces a plausible picture nobody can check.
    status: "In progress"
    tag: "building"
    status_note: "Published work covers the sensing half. The inverse-problem half is not yet finished."

  - key: "II"
    title: "What can be known together?"
    capability: "Distributed, partial observers"
    body: >-
      One good camera is a single point of failure and a privacy problem. Many cheap,
      unreliable, intermittent observers might be the better instrument — but only if they can
      agree on identity when they have never synchronised, and on what to do when their views
      conflict. A shared spatial state has to survive disagreement, latency and loss.
    status: "Early"
    tag: "building"
    status_note: "Formally open. Hydra-Bench is a first step toward synchronised multi-modal evidence."

  - key: "III"
    title: "When should intelligence change the world?"
    capability: "Authority, and the right to decline"
    body: >-
      A wrong action has a physical cost that a wrong prediction does not. Reasoning should be
      able to propose, revise and defer, while the decision to actually move something stays
      inside explicit bounds. I want to know when better prediction does not change the decision
      at all, and when a system should hand control back to a person instead of acting.
    status: "Open"
    tag: "open"
    status_note: "Driven by the ageing-and-driving work, where the cost of a false alarm and the cost of a miss are not the same number."

# What the trajectory actually looked like — each project forced a requirement rather than
# filling a slot. This is the antidote to retrospective branding.
trajectory_note: >-
  These questions were not chosen and then fitted to the work. Each one is where a project
  left me — the leaf-wetness line forced observability and persistence, the driving line forced
  meaning and authority, and the two together forced the question of who decides.

# What I am actually looking for. Honest, and deliberately not "a postdoc".
looking_for: >-
  I am not optimising for a job title. I want a setting where the sensing, the modelling and the
  decision are argued about by people who disagree — and where the work has to survive contact
  with somewhere real.