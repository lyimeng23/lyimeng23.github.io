main:
  - key: "01"
    label: "Physical World"
    question: "What exists before a model interprets it?"
    summary: "A physical space contains people, vehicles, infrastructure, and context—not a clean, complete dataset."
    layer: "world"
  - key: "02"
    label: "Perceive"
    question: "What is there?"
    summary: "Incomplete camera, RF, vehicle, and human-sensing observations become evidence about the same scene."
    layer: "perceive"
  - key: "03"
    label: "Represent"
    question: "Where is it, and how is it related?"
    summary: "Observations become objects, positions, trajectories, identities, and relations such as crossing or approaching."
    layer: "represent"
  - key: "04"
    label: "Model"
    question: "How is the world changing?"
    summary: "A persistent spatial state connects the same entities across time and records state transitions."
    layer: "model"
  - key: "05"
    label: "Reason & Predict"
    question: "Why is it changing, and what happens next?"
    summary: "Relations, uncertainty, and possible futures support risk-aware prediction instead of isolated detection."
    layer: "reason"
  - key: "06"
    label: "Act"
    question: "What should the agent do?"
    summary: "The system turns grounded spatial understanding into a safe response: slow down, continue, alert, or re-plan."
    layer: "act"
