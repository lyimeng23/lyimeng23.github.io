# ============================================================
# Jekyll build
# ============================================================
# The site ships its own layout/SASS. The github-pages gem injects
# jekyll-theme-primer by default, which silently publishes an unused
# assets/css/style.css; `theme: null` turns that off.
theme: null
# Compressed CSS output: GitHub Pages does not minify for us.
sass:
  style: compressed

plugins:
  - jekyll-sitemap

# Show a modest "last updated" date in the footer (build time).
enable_last_update: true

# Note: jekyll-sitemap also lists the paper PDFs. That is intentional — the
# papers themselves are meant to be findable. Static files cannot carry front
# matter, so they cannot be excluded individually.

# Files never rendered into the published site.
exclude:
  - README.md
  - AGENTS.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - build.sh
  - CNAME
  - _site
  - .git
  - .github
  - .opencode
  - docs
  - google_scholar_crawler
  - project/caspianpost
  - progress.md
