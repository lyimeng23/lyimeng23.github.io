# Short human + SEO-friendly one-liners. Keep keywords focused (no stuffing).
description: >
  Yimeng Liu, Ph.D. candidate at Michigan State University. Research on reliable
  physical-world understanding from incomplete observations, with published work
  in multimodal sensing and physical-state estimation.
# Cut from twelve broad terms to five that the published record actually supports.
# Removed: Physical AI, Embodied AI, world modeling, intelligent systems, IoT — none of which
# is evidenced by a paper, and each of which dilutes the terms that are.
