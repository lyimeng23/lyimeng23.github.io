# ============================================================
# Jekyll build
# ============================================================
# The site ships its own layout/SASS (no remote theme), so we control the design
# and avoid upstream template drift.
plugins:
  - jekyll-sitemap

# Show a modest "last updated" date in the footer (build time).
enable_last_update: true

# Files never rendered into the published site.
exclude:
  - README.md
  - README copy.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - build.sh
  - CNAME
  - task_plan.md
  - findings.md
  - progress.md
  - AUDIT_REPORT.md
  - _site
  - .git
  - .github
  - .opencode
  - docs
  - google_scholar_crawler
