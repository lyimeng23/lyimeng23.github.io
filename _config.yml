  - Yimeng Liu
  - Michigan State University
  - Spatial Intelligence
  - Physical AI
  - Embodied AI
  - mobile computing
  - wireless sensing
  - mmWave sensing
  - IoT
  - multimodal perception
  - world modeling
  - intelligent systems

